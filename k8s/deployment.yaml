apiVersion: v1
kind: Namespace
metadata:
  name: memoq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoq-ui
  namespace: memoq
  labels:
    app: memoq-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memoq-ui
  template:
    metadata:
      labels:
        app: memoq-ui
    spec:
      containers:
      - name: memoq-ui
        image: memoq-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: basic-auth
          mountPath: /etc/nginx/.htpasswd
          subPath: .htpasswd
      volumes:
      - name: nginx-conf
        configMap:
          name: memoq-nginx-conf
      - name: basic-auth
        secret:
          secretName: memoq-basic-auth
---
apiVersion: v1
kind: Service
metadata:
  name: memoq-ui
  namespace: memoq
spec:
  type: NodePort
  selector:
    app: memoq-ui
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
