apiVersion: v1
kind: ConfigMap
metadata:
  name: memoq-nginx-conf
  namespace: memoq
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Unauthenticated so kubelet's readiness/liveness probes don't need credentials.
        location = /healthz {
            auth_basic off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            # Restores the Basic Auth this file's name always implied but the config never
            # actually carried -- .htpasswd comes from the memoq-basic-auth Secret, mounted by
            # k8s/deployment.yaml's memoq-basic-auth volume.
            auth_basic "Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            # No explicit Cache-Control previously meant browsers fell back to
            # heuristic caching off Last-Modified, which kept serving stale
            # HTML/CSS/JS for a while after a deploy until a manual hard
            # refresh. "no-cache" doesn't disable caching -- it just forces a
            # conditional revalidation (If-None-Match) on every load, so a
            # fresh deploy is picked up immediately while unchanged assets
            # still get a cheap 304.
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }
    }
