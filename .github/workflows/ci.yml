name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # No test suite exists for this plain HTML/CSS/vanilla-JS app (see CLAUDE.md) -- this catches
  # what's actually cheap and worth catching: JS syntax errors and a broken Dockerfile/build.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          for f in app.js auth.js api.js questions-data.js; do
            echo "Checking $f"
            node --check "$f"
          done

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t memoq-ui:ci .
